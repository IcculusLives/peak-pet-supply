
<!-- buddy-paste: paste a settings JSON from Claude to try it (added 2026-10-17) -->
<script>(function(){var KEY='pps_summit_cfg15';function go(){var b=document.createElement("button");b.id="buddy-paste";b.textContent="📥 paste settings";b.style.cssText="position:fixed;left:10px;bottom:10px;z-index:99999;background:#111;color:#eee;border:1px solid #444;border-radius:6px;padding:5px 9px;cursor:pointer;opacity:.85;font:12px -apple-system,system-ui,sans-serif";b.onclick=function(){var t=prompt("Paste the settings JSON:");if(!t)return;try{var j=JSON.parse(t);if(typeof j!=="object")throw 0;localStorage.setItem(KEY,JSON.stringify(j));location.reload();}catch(e){alert("That was not valid settings JSON.");}};document.body.appendChild(b);}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);else go();})();</script>
